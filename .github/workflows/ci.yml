name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Build
        run: cargo build -p demolition --release --locked
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/Demolition-linux-x64.tar.gz -C target/release demolition
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          packaging/macos/bundle.sh target/release/demolition dist
          ditto -c -k --keepParent dist/Demolition.app dist/Demolition-macos-arm64.zip
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path target/release/demolition.exe -DestinationPath dist/Demolition-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Demolition-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
